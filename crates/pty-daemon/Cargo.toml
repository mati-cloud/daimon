[package]
name = "pty-daemon"
version.workspace = true
edition = "2021"

[[bin]]
name = "pty-daemon"
path = "src/main.rs"

[dependencies]
shell-parser = { path = "../shell-parser" }
daimon-complete = { path = "../daimon-complete" }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
flate2 = "1"
png = "0.17"
sha2 = "0.10"
regex-lite = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio-test = "0.4"
