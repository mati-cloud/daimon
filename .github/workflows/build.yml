name: build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Release to attach the archives to
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            runner: blacksmith-4vcpu-ubuntu-2404
          - os: linux
            arch: arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
          - os: macos
            arch: arm64
            runner: blacksmith-6vcpu-macos-15
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config zstd \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: ./build.sh

      - name: Package
        run: tar -czf daimon2-${{ matrix.os }}-${{ matrix.arch }}.tar.gz -C dist daimon2-${{ matrix.os }}-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: daimon2-${{ matrix.os }}-${{ matrix.arch }}
          path: daimon2-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - name: Attach to release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" daimon2-${{ matrix.os }}-${{ matrix.arch }}.tar.gz --clobber --repo "${{ github.repository }}"
